<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">VoyageAtlas icon</title>
  <desc id="desc">A glowing globe with a flight path and aircraft.</desc>
  <defs>
    <radialGradient id="space" cx="35%" cy="24%" r="78%">
      <stop offset="0" stop-color="#1f6fff"/>
      <stop offset="0.48" stop-color="#123968"/>
      <stop offset="1" stop-color="#07111f"/>
    </radialGradient>
    <linearGradient id="globe" x1="15" y1="12" x2="49" y2="52">
      <stop offset="0" stop-color="#68f0ff"/>
      <stop offset="0.56" stop-color="#20a7ff"/>
      <stop offset="1" stop-color="#1b4cff"/>
    </linearGradient>
    <linearGradient id="route" x1="12" y1="48" x2="52" y2="16">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="0.5" stop-color="#73fff4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#space)"/>
  <circle cx="32" cy="32" r="21.5" fill="url(#globe)" opacity="0.96"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#bffbff" stroke-width="1.7" opacity="0.72"/>

  <path d="M16.5 30.5c7.3 2.8 13.1 3.2 18.5 1.1 3.8-1.5 7.8-1.9 12.8-.2" fill="none" stroke="#c9ffff" stroke-width="1.5" opacity="0.38"/>
  <path d="M22.5 15.7c-2.8 5.2-4.1 10.7-3.9 16.4.2 5.6 1.9 10.9 5.2 15.9" fill="none" stroke="#d7ffff" stroke-width="1.25" opacity="0.32"/>
  <path d="M41.5 15.7c2.8 5.2 4.1 10.7 3.9 16.4-.2 5.6-1.9 10.9-5.2 15.9" fill="none" stroke="#d7ffff" stroke-width="1.25" opacity="0.32"/>
  <path d="M32 11.5c3.7 5.7 5.6 12.5 5.6 20.5S35.7 46.8 32 52.5c-3.7-5.7-5.6-12.5-5.6-20.5S28.3 17.2 32 11.5Z" fill="none" stroke="#e7ffff" stroke-width="1.1" opacity="0.34"/>

  <path d="M11.5 46.5C24.2 28.8 38.4 19 53 16.5" fill="none" stroke="#06101d" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <path d="M11.5 46.5C24.2 28.8 38.4 19 53 16.5" fill="none" stroke="url(#route)" stroke-width="3.2" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="13" cy="44.6" r="2.6" fill="#ffe66d"/>
  <circle cx="51.6" cy="16.8" r="2.4" fill="#ffffff"/>

  <g transform="translate(43 13) rotate(-22)" filter="url(#softGlow)">
    <path d="M1.6 8.2 18.9 1.4 14.1 14.7 10.6 9.6 5.4 12.7Z" fill="#ffffff"/>
    <path d="M10.6 9.6 18.9 1.4 14.1 14.7Z" fill="#73fff4" opacity="0.72"/>
  </g>
</svg>
